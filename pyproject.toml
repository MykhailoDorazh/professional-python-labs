[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-analytics"
version = "0.2.0"
description = "Bank accounts analysis - laboratory work 2 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]

[project.scripts]
bank-analytics = "bank_analytics.main:main"
bank-benchmark = "bank_analytics.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
