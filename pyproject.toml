[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-io"
version = "0.5.0"
description = "Reliable import/export of bank operations - laboratory work 5 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
bank-io = "bank_io.main:main"

[tool.setuptools.packages.find]
where = ["src"]
