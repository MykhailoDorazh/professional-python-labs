[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-manager"
version = "0.1.0"
description = "Employee management system - laboratory work 1 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]

[project.scripts]
employee-manager = "employee_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]
