[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-db"
version = "0.7.0"
description = "Bank accounts system with SQLite persistence - laboratory work 7 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
]

[project.scripts]
bank-db = "bank_db.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_db = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
mypy_path = "src"
strict = true
