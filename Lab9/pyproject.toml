[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-perf"
version = "0.9.0"
description = "Bank accounts system REST API, profiling and optimization - laboratory work 9 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "matplotlib>=3.8",
]

[project.scripts]
bank-perf = "bank_perf.main:main"
bank-perf-client = "bank_perf.external_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_perf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    # starlette's TestClient announces a future switch of its HTTP backend
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
