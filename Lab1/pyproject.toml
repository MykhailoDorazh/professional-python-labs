[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-accounts"
version = "0.1.0"
description = "Bank accounts system - laboratory work 1 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]

[project.scripts]
bank-accounts = "bank_accounts.main:main"

[tool.setuptools.packages.find]
where = ["src"]
