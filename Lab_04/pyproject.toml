[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-domain"
version = "0.4.0"
description = "Typed object model of the bank accounts system - laboratory work 4 for Professional Python"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Дораж Михайло" }]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
]

[project.scripts]
bank-domain = "bank_domain.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.setuptools.package-data]
bank_domain = ["py.typed"]
