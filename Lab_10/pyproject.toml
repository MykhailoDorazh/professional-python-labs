[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-account-service"
version = "1.0.0"
description = "Bank accounts REST API: clients, accounts, atomic transfers, history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Дораж Михайло" }]
keywords = ["bank", "fastapi", "sqlalchemy", "rest-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
bank-account-service = "bank_account_service.main:main"
bank-api-client = "bank_account_service.external_api:main"

[project.urls]
Documentation = "http://localhost:8000/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bank_account_service = ["py.typed", "migrations/script.py.mako"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Ukrainian letters in strings/comments are intended

[tool.ruff.lint.per-file-ignores]
"src/bank_account_service/migrations/versions/*" = ["E501", "UP035", "I001", "W291"]  # generated
"tests/*" = ["SIM117"]  # nested `with pytest.raises(...)` shows exactly which block must fail

[tool.mypy]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["bank_account_service"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ['if __name__ == .__main__.:']
